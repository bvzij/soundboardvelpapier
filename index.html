<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<title>Soundboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #16181d;
    --panel: #22252d;
    --line: #333844;
    --text: #f2f3f5;
    --muted: #9aa1ad;
    --accent: #ffb020;
    --danger: #ff5a5a;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; cursor: pointer; }

  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    background: rgba(22, 24, 29, .94); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 20px; margin: 0; font-weight: 700; }
  .actions { display: flex; gap: 8px; }
  .btn {
    border: 1px solid var(--line); background: var(--panel);
    padding: 10px 16px; border-radius: 12px; font-weight: 600; min-height: 44px;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1300; }
  .btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn:disabled { opacity: .4; }

  #grid {
    display: grid; gap: 14px; padding: 16px;
    grid-template-columns: repeat(auto-fill, minmax(var(--tile, 150px), 1fr));
  }
  .tile {
    position: relative; display: flex; flex-direction: column;
    padding: 0; border: 3px solid transparent; border-radius: var(--radius);
    background: var(--panel); overflow: hidden;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    transition: transform .08s ease, border-color .15s ease;
  }
  .tile:active { transform: scale(.96); }
  .tile img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; pointer-events: none; }
  .tile span {
    display: block; padding: 8px 10px; font-weight: 600; font-size: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
  }
  .tile.playing { border-color: var(--accent); }
  .tile.playing::after {
    content: "♪"; position: absolute; top: 8px; right: 8px;
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent); color: #1a1300; font-weight: 800;
    display: grid; place-items: center; font-size: 18px;
  }
  body.editing .tile { border-style: dashed; border-color: var(--muted); }
  body.editing .tile::before {
    content: "✎"; position: absolute; top: 8px; left: 8px;
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--text); color: var(--bg);
    display: grid; place-items: center; font-size: 17px;
  }

  #empty { text-align: center; color: var(--muted); padding: 60px 24px; }
  #empty strong { color: var(--text); }

  dialog {
    width: min(480px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
    border: 1px solid var(--line); border-radius: 20px;
    background: var(--panel); color: var(--text); padding: 20px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  dialog h2 { margin: 0 0 16px; font-size: 19px; }
  .pick {
    position: relative;
    display: grid; place-items: center; width: 100%; height: 240px;
    border: 2px dashed var(--line); border-radius: 16px; overflow: hidden;
    background: var(--bg); color: var(--muted); text-align: center; padding: 0;
  }
  .pick img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
  .pick.has img { display: block; }
  .pick.has span { display: none; }
  .field { margin-top: 16px; }
  .field > .lbl { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  .soundrow { display: flex; gap: 8px; align-items: center; }
  #recBtn.rec { background: var(--danger); border-color: var(--danger); color: #fff; }
  .soundrow { flex-wrap: wrap; }
  .soundrow .name { flex: 1; min-width: 0; color: var(--muted); font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input[type=text] {
    width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit;
  }
  .row { display: flex; gap: 8px; margin-top: 20px; }
  .row .grow { flex: 1; }
  #editExtras { display: none; }
  #editExtras.show { display: flex; }

  #stopFab {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 10;
    border: 0; border-radius: 999px; padding: 12px 26px; min-height: 48px;
    background: var(--danger); color: #fff; font-weight: 700;
    box-shadow: 0 6px 20px rgba(0,0,0,.45);
  }
  #grid { padding-bottom: 100px; }
  dialog.drag { outline: 3px dashed var(--accent); outline-offset: -8px; }
  .drophint { color: var(--muted); font-size: 13px; text-align: center; margin: 10px 0 0; }
  .vrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--line); }
  .vrow .vname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .vrow .vpct { color: var(--muted); font-size: 14px; min-width: 48px; text-align: right; }
  .vrow .vctl { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; }
  .vrow input[type=range] { flex: 1; accent-color: var(--accent); height: 32px; }
  .vrow .btn { padding: 6px 12px; min-height: 36px; }
  #volList { max-height: 60vh; overflow-y: auto; }
  .size { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .size input { width: 110px; accent-color: var(--accent); }
  header { flex-wrap: wrap; }
  .trim { position: relative; height: 84px; margin-top: 10px; border-radius: 12px; overflow: hidden;
    background: var(--bg); border: 1px solid var(--line); touch-action: none; }
  .trim canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .trim input[type=range] {
    position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
    -webkit-appearance: none; appearance: none; background: transparent; pointer-events: none;
  }
  .trim input[type=range]::-webkit-slider-runnable-track { background: transparent; height: 100%; }
  .trim input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; pointer-events: auto; width: 22px; height: 84px;
    background: var(--accent); border-radius: 6px; cursor: ew-resize;
  }
  .trim input[type=range]::-moz-range-thumb {
    pointer-events: auto; width: 22px; height: 84px; border: 0;
    background: var(--accent); border-radius: 6px; cursor: ew-resize;
  }
  .triminfo { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 6px; }
  .triminfo button { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 0; }
  #toast {
    position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-weight: 600; transition: all .2s ease; z-index: 20; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <h1>Soundboard</h1>
  <label class="size">▪<input type="range" id="sizeRange" min="90" max="320" step="10" aria-label="Tile size">■</label>
  <div class="actions">
    <button class="btn" id="volBtn" aria-label="Volume settings">⚙ Volume</button>
    <button class="btn" id="editBtn">Edit</button>
    <button class="btn primary" id="addBtn">+ Add</button>
  </div>
</header>

<main id="grid"></main>
<div id="empty" hidden>
  <p><strong>No buttons yet.</strong></p>
  <p>Tap <strong>+ Add</strong>, pick a picture and a sound file (max 4 MB).</p>
</div>

<dialog id="dlg">
  <h2 id="dlgTitle">New button</h2>

  <button type="button" class="pick" id="imgPick">
    <img id="imgPreview" alt="">
    <span>Tap to choose a picture<br><small>Optional — leave empty to use the label's initials</small></span>
  </button>
  <input type="file" id="imgInput" accept="image/*" hidden>

  <div class="field">
    <span class="lbl">Sound</span>
    <div class="soundrow">
      <button type="button" class="btn" id="soundBtn">Choose file</button>
      <button type="button" class="btn" id="recBtn">● Record</button>
      <button type="button" class="btn" id="previewBtn" disabled>▶</button>
      <span class="name" id="soundName">No file chosen</span>
    </div>
    <div id="trimBox" hidden>
      <div class="trim">
        <canvas id="trimCanvas"></canvas>
        <input type="range" id="trimStart" min="0" max="1000" value="0" aria-label="Trim start">
        <input type="range" id="trimEnd" min="0" max="1000" value="1000" aria-label="Trim end">
      </div>
      <div class="triminfo"><span id="trimInfo"></span><button type="button" id="trimReset">Reset trim</button></div>
    </div>
    <input type="file" id="soundInput" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.opus,.flac" hidden>
  </div>

  <div class="field">
    <span class="lbl">Label (optional)</span>
    <input type="text" id="labelInput" maxlength="40" placeholder="e.g. Applause">
  </div>

  <p class="drophint">Tip: you can also drag &amp; drop a picture and a sound here.</p>

  <div class="row" id="editExtras">
    <button type="button" class="btn" id="moveLeft">← Move</button>
    <button type="button" class="btn" id="moveRight">Move →</button>
    <span class="grow"></span>
    <button type="button" class="btn danger" id="deleteBtn">Delete</button>
  </div>

  <div class="row">
    <span class="grow"></span>
    <button type="button" class="btn" id="cancelBtn">Cancel</button>
    <button type="button" class="btn primary" id="saveBtn">Save</button>
  </div>
</dialog>

<dialog id="volDlg">
  <h2>Volume per sound</h2>
  <div id="volList"></div>
  <div class="row">
    <span class="grow"></span>
    <button type="button" class="btn" id="volCancel">Cancel</button>
    <button type="button" class="btn primary" id="volSave">Save</button>
  </div>
</dialog>

<button id="stopFab" aria-label="Stop sound">■ Stop</button>
<div id="toast"></div>

<script>
(() => {
  // ---------- Shared storage (Vercel Blob via /api) ----------
  async function api(path, opts) {
    const r = await fetch(path, opts);
    let data = null;
    try { data = await r.json(); } catch {}
    if (!r.ok) throw new Error((data && data.error) || ('Error ' + r.status));
    return data;
  }
  const fetchItems = () => api('/api/items', { cache: 'no-store' });
  const saveItems = (...items) => api('/api/items', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items }),
  });
  const removeItem = id => api('/api/items?id=' + encodeURIComponent(id), { method: 'DELETE' });

  const MAX_BYTES = 4.3 * 1024 * 1024;
  const EXT_TYPES = { mp3: 'audio/mpeg', m4a: 'audio/mp4', aac: 'audio/aac', wav: 'audio/wav',
    ogg: 'audio/ogg', opus: 'audio/ogg', webm: 'audio/webm', flac: 'audio/flac', webp: 'image/webp',
    jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif' };
  async function uploadFile(blob, name) {
    if (blob.size > MAX_BYTES) throw new Error('File too big (max 4 MB)');
    const ext = (name.split('.').pop() || '').toLowerCase();
    const type = blob.type || EXT_TYPES[ext] || 'application/octet-stream';
    const res = await api('/api/media?name=' + encodeURIComponent(name), {
      method: 'POST', headers: { 'Content-Type': type }, body: blob,
    });
    return res.url;
  }

  // ---------- Elements ----------
  const $ = id => document.getElementById(id);
  const grid = $('grid'), empty = $('empty'), dlg = $('dlg');
  const imgPick = $('imgPick'), imgPreview = $('imgPreview'), imgInput = $('imgInput');
  const soundBtn = $('soundBtn'), soundInput = $('soundInput'), soundName = $('soundName');
  const previewBtn = $('previewBtn'), labelInput = $('labelInput'), saveBtn = $('saveBtn');

  // ---------- State ----------
  let items = [];
  let lastJson = '';
  let editing = false;
  let busy = false;
  let playingId = null;

  const newId = () => (crypto.randomUUID ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2));

  let toastTimer;
  function toast(msg, ms = 2200) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  // ---------- Sync ----------
  async function refresh(force) {
    if (busy || dlg.open || (typeof volDlg !== 'undefined' && volDlg.open)) return;
    try {
      const list = await fetchItems();
      const json = JSON.stringify(list);
      if (!force && json === lastJson) return;
      lastJson = json;
      items = list;
      render();
      if (ctx) preloadAll();
    } catch (e) {
      if (force) toast(e.message, 4000);
    }
  }

  // ---------- Playback ----------
  // Web Audio: instant restart on every tap + volume above 100%.
  // Falls back to a plain <audio> element if a file can't be decoded.
  let ctx = null;
  const buffers = new Map();   // sound url -> Promise<{ buf, norm }|null>
  let limiter = null;

  // Auto-level: boost quiet sounds (e.g. mic recordings) so their loudest
  // point sits near full scale. Capped so silence/noise isn't blown up.
  function normGain(buf) {
    let peak = 0;
    for (let ch = 0; ch < buf.numberOfChannels; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < d.length; i++) { const v = d[i] < 0 ? -d[i] : d[i]; if (v > peak) peak = v; }
    }
    return peak > 0.0001 ? Math.min(10, 0.95 / peak) : 1;
  }
  // Limiter: lets the slider go far above 100% (much louder) without harsh distortion
  function output(c) {
    if (!limiter) {
      limiter = c.createDynamicsCompressor();
      limiter.threshold.value = -3;
      limiter.knee.value = 0;
      limiter.ratio.value = 20;
      limiter.attack.value = 0.002;
      limiter.release.value = 0.15;
      limiter.connect(c.destination);
    }
    return limiter;
  }
  let current_src = null;      // { stop() }
  const fallback = new Audio();
  fallback.addEventListener('ended', () => { playingId = null; markPlaying(); });

  function audioCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function loadBuffer(url) {
    if (!buffers.has(url)) {
      buffers.set(url, fetch(url)
        .then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
        .then(b => audioCtx().decodeAudioData(b))
        .then(buf => ({ buf, norm: normGain(buf) }))
        .catch(() => null));
    }
    return buffers.get(url);
  }
  const vol = item => (Number.isFinite(item.volume) ? item.volume : 1);

  function stopSource() {
    if (current_src) { try { current_src.stop(); } catch {} current_src = null; }
    fallback.pause();
  }

  async function playUrl(url, volume, id, trim) {
    stopSource();
    playingId = id;
    markPlaying();
    const c = audioCtx();
    const loaded = await loadBuffer(url);
    if (playingId !== id) return;           // another tap happened meanwhile
    if (loaded) {
      const src = c.createBufferSource();
      const gain = c.createGain();
      gain.gain.value = loaded.norm * volume;
      src.buffer = loaded.buf;
      src.connect(gain).connect(output(c));
      src.onended = () => { if (current_src === src) { current_src = null; playingId = null; markPlaying(); } };
      stopSource();
      current_src = src;
      const t0 = Math.max(0, (trim && trim.trimStart) || 0);
      const t1 = Math.min(loaded.buf.duration, (trim && trim.trimEnd) || loaded.buf.duration);
      if (t1 > t0) src.start(0, t0, t1 - t0); else src.start();
    } else {
      fallback.src = url;
      fallback.volume = Math.min(1, volume);
      fallback.currentTime = (trim && trim.trimStart) || 0;
      fallback.play().catch(() => { playingId = null; markPlaying(); toast("This sound can't be played"); });
    }
  }

  // Every tap restarts the sound from the beginning
  const play = item => playUrl(item.sound, vol(item), item.id, item);

  function stop() {
    stopSource();
    playingId = null;
    markPlaying();
  }
  function markPlaying() {
    grid.querySelectorAll('.tile').forEach(t =>
      t.classList.toggle('playing', t.dataset.id === playingId));
  }
  function preloadAll() { items.forEach(i => i.sound && loadBuffer(i.sound)); }

  // ---------- Grid ----------
  function render() {
    items.sort((a, b) => a.order - b.order);
    grid.innerHTML = '';
    for (const item of items) {
      const tile = document.createElement('button');
      tile.className = 'tile';
      tile.dataset.id = item.id;
      const img = document.createElement('img');
      img.src = item.image;
      img.alt = item.label || '';
      img.draggable = false;
      img.loading = 'lazy';
      tile.append(img);
      if (item.label) {
        const span = document.createElement('span');
        span.textContent = item.label;
        tile.append(span);
      }
      bindTile(tile, item);
      grid.append(tile);
    }
    empty.hidden = items.length > 0;
    document.body.classList.toggle('editing', editing);
    $('editBtn').classList.toggle('on', editing);
    $('editBtn').textContent = editing ? 'Done' : 'Edit';
    markPlaying();
  }

  function bindTile(tile, item) {
    let pressTimer = null, longPressed = false;
    const clear = () => { clearTimeout(pressTimer); pressTimer = null; };
    tile.addEventListener('pointerdown', () => {
      longPressed = false;
      pressTimer = setTimeout(() => { longPressed = true; openEditor(item); }, 600);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(e => tile.addEventListener(e, clear));
    tile.addEventListener('contextmenu', e => e.preventDefault());
    tile.addEventListener('click', () => {
      if (longPressed) { longPressed = false; return; }
      if (editing) openEditor(item); else play(item);
    });
  }

  // ---------- Editor ----------
  let current = null;    // item being edited, or null for new
  let pending = {};      // { image: Blob, imageName, sound: Blob, soundName }
  const localUrls = [];
  const previewAudio = new Audio();
  const tempUrl = blob => { const u = URL.createObjectURL(blob); localUrls.push(u); return u; };

  function setImagePreview(src) {
    if (src) { imgPreview.src = src; imgPick.classList.add('has'); }
    else { imgPreview.removeAttribute('src'); imgPick.classList.remove('has'); }
  }

  function openEditor(item) {
    stop();
    current = item || null;
    pending = {};
    $('dlgTitle').textContent = item ? 'Edit button' : 'New button';
    setImagePreview(item ? item.image : null);
    soundName.textContent = item ? (item.soundName || 'Current sound') : 'No file chosen';
    previewBtn.disabled = !item;
    labelInput.value = item ? (item.label || '') : '';
    $('editExtras').classList.toggle('show', !!item);
    if (item) {
      const i = items.indexOf(item);
      $('moveLeft').disabled = i <= 0;
      $('moveRight').disabled = i >= items.length - 1;
    }
    imgInput.value = ''; soundInput.value = '';
    setBusy(false);
    trimToken++; trimBox.hidden = true; trimBuf = null;
    dlg.showModal();
    if (item && item.sound) setupTrim(item.sound, item.trimStart, item.trimEnd);
  }

  function closeEditor() {
    trimToken++; trimBuf = null; trimBox.hidden = true;
    stopRecording(true);
    stop();
    localUrls.splice(0).forEach(u => URL.revokeObjectURL(u));
    setImagePreview(null);
    dlg.close();
  }

  function setBusy(on, label) {
    busy = on;
    dlg.querySelectorAll('button').forEach(b => { b.disabled = on || b.dataset.off === '1'; });
    saveBtn.textContent = on ? (label || 'Saving…') : 'Save';
    if (!on) {
      previewBtn.disabled = !(pending.sound || current);
      if (current) {
        const i = items.indexOf(current);
        $('moveLeft').disabled = i <= 0;
        $('moveRight').disabled = i >= items.length - 1;
      }
    }
  }

  // Shrink big photos so uploads stay small and the grid stays fast
  async function shrinkImage(file, max = 640) {
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale);
      c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.85));
      return blob || file;
    } catch {
      return file;
    }
  }

  imgPick.addEventListener('click', () => imgInput.click());
  async function takeImage(f) {
    pending.image = await shrinkImage(f);
    pending.imageName = f.name.replace(/\.[^.]+$/, '') + (pending.image.type === 'image/webp' ? '.webp' : '');
    setImagePreview(tempUrl(pending.image));
  }
  imgInput.addEventListener('change', () => { if (imgInput.files[0]) takeImage(imgInput.files[0]); });

  // ---------- Trim pad ----------
  const trimBox = $('trimBox'), trimCanvas = $('trimCanvas');
  const tS = $('trimStart'), tE = $('trimEnd'), trimInfo = $('trimInfo');
  let trimBuf = null, trimToken = 0, trimPeaks = null;
  const MIN_GAP = 20; // 2% of the length

  async function setupTrim(src, start, end) {
    const token = ++trimToken;
    trimBox.hidden = true; trimBuf = null; trimPeaks = null;
    let buf = null;
    try {
      if (src instanceof Blob) buf = await audioCtx().decodeAudioData(await src.arrayBuffer());
      else { const l = await loadBuffer(src); buf = l && l.buf; }
    } catch {}
    if (!buf || token !== trimToken || !dlg.open) return;
    trimBuf = buf;
    const d = buf.duration;
    tS.value = start ? Math.round(Math.min(1, start / d) * 1000) : 0;
    tE.value = end ? Math.round(Math.min(1, end / d) * 1000) : 1000;
    trimBox.hidden = false;
    trimPeaks = null;
    requestAnimationFrame(drawTrim);
  }

  function computePeaks(cols) {
    const ch = trimBuf.getChannelData(0);
    const step = Math.max(1, Math.floor(ch.length / cols));
    const out = new Float32Array(cols);
    let max = 0;
    for (let x = 0; x < cols; x++) {
      let p = 0;
      const from = x * step, to = Math.min(ch.length, from + step);
      for (let i = from; i < to; i += 4) { const v = Math.abs(ch[i]); if (v > p) p = v; }
      out[x] = p; if (p > max) max = p;
    }
    if (max > 0) for (let x = 0; x < cols; x++) out[x] /= max;
    return out;
  }

  function drawTrim() {
    if (!trimBuf) return;
    const dpr = window.devicePixelRatio || 1;
    const w = trimCanvas.clientWidth, h = trimCanvas.clientHeight;
    if (!w) return;
    if (trimCanvas.width !== Math.round(w * dpr)) { trimCanvas.width = Math.round(w * dpr); trimCanvas.height = Math.round(h * dpr); trimPeaks = null; }
    const g = trimCanvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const cols = Math.floor(w / 3);
    if (!trimPeaks || trimPeaks.length !== cols) trimPeaks = computePeaks(cols);
    const a = (+tS.value / 1000) * w, b = (+tE.value / 1000) * w;
    for (let x = 0; x < cols; x++) {
      const px = x * 3, bh = Math.max(2, trimPeaks[x] * (h - 16));
      g.fillStyle = px >= a && px <= b ? '#ffb020' : '#4a505c';
      g.fillRect(px, (h - bh) / 2, 2, bh);
    }
    g.fillStyle = 'rgba(0,0,0,.45)';
    g.fillRect(0, 0, a, h);
    g.fillRect(b, 0, w - b, h);
    const d = trimBuf.duration;
    trimInfo.textContent = `${(tS.value / 1000 * d).toFixed(1)}s – ${(tE.value / 1000 * d).toFixed(1)}s  (of ${d.toFixed(1)}s)`;
  }

  tS.addEventListener('input', () => { if (+tS.value > +tE.value - MIN_GAP) tS.value = +tE.value - MIN_GAP; drawTrim(); });
  tE.addEventListener('input', () => { if (+tE.value < +tS.value + MIN_GAP) tE.value = +tS.value + MIN_GAP; drawTrim(); });
  // Play the trimmed part when you let go of a handle
  [tS, tE].forEach(el => el.addEventListener('change', () => previewBtn.click()));
  $('trimReset').addEventListener('click', () => { tS.value = 0; tE.value = 1000; drawTrim(); });

  function currentTrim() {
    if (!trimBuf || trimBox.hidden) {
      return pending.sound ? { trimStart: null, trimEnd: null }
        : { trimStart: current ? current.trimStart || null : null, trimEnd: current ? current.trimEnd || null : null };
    }
    const d = trimBuf.duration;
    const s0 = +tS.value / 1000 * d, e0 = +tE.value / 1000 * d;
    return { trimStart: s0 > 0.02 ? +s0.toFixed(3) : null, trimEnd: e0 < d - 0.02 ? +e0.toFixed(3) : null };
  }

  soundBtn.addEventListener('click', () => soundInput.click());
  soundInput.addEventListener('change', () => { if (soundInput.files[0]) takeSound(soundInput.files[0]); });
  function takeSound(f, isRecording) {
    if (f.size > MAX_BYTES) { toast('Sound too big (max 4 MB)'); soundInput.value = ''; return; }
    pending.sound = f;
    pending.soundName = f.name;
    soundName.textContent = f.name;
    setupTrim(f, null, null);
    previewBtn.disabled = false;
    if (!isRecording && !labelInput.value.trim() && !current) {
      labelInput.value = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').slice(0, 40);
    }
 }

  // ---------- Microphone recording ----------
  const recBtn = $('recBtn');
  let rec = null;   // { recorder, stream, timer, start }
  const MAX_REC_SECONDS = 60;
  function stopRecording(discard) {
    if (!rec) return;
    rec.discard = !!discard;
    clearInterval(rec.timer);
    if (rec.recorder.state !== 'inactive') rec.recorder.stop();
  }
  recBtn.addEventListener('click', async () => {
    if (rec) { stopRecording(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) { toast('Recording is not supported in this browser'); return; }
    stop();
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
    } catch {
      toast('Microphone not allowed — check the browser permission', 4000);
      return;
    }
    const type = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']
      .find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    const recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const discard = rec && rec.discard;
      rec = null;
      recBtn.classList.remove('rec');
      recBtn.textContent = '● Record';
      if (discard || !chunks.length) return;
      const mime = (recorder.mimeType || type || 'audio/webm').split(';')[0];
      const ext = mime.includes('mp4') ? 'm4a' : mime.includes('ogg') ? 'ogg' : 'webm';
      const stamp = new Date().toTimeString().slice(0, 8).replace(/:/g, '-');
      const file = new File(chunks, `recording-${stamp}.${ext}`, { type: mime });
      takeSound(file, true);
    };
    rec = { recorder, stream, start: Date.now() };
    recorder.start();
    recBtn.classList.add('rec');
    const tick = () => {
      const sec = Math.floor((Date.now() - rec.start) / 1000);
      recBtn.textContent = `■ Stop ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
      if (sec >= MAX_REC_SECONDS) stopRecording();
    };
    tick();
    rec.timer = setInterval(tick, 250);
  });

  // ---------- Initials picture (when no picture is chosen) ----------
  function initialsOf(label) {
    const words = label.trim().split(/\s+/).filter(Boolean);
    if (!words.length) return '?';
    const s = words.length === 1 ? [...words[0]].slice(0, 2).join('') : [...words[0]][0] + [...words[1]][0];
    return s.toUpperCase();
  }
  function initialsImage(label) {
    const size = 512;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    let h = 0;
    for (const ch of label) h = (h * 31 + ch.codePointAt(0)) % 360;
    g.fillStyle = `hsl(${h}, 62%, 42%)`;
    g.fillRect(0, 0, size, size);
    const text = initialsOf(label);
    g.fillStyle = '#fff';
    g.font = `800 ${text.length > 1 ? 220 : 260}px system-ui, -apple-system, Roboto, sans-serif`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(text, size / 2, size / 2 + 12);
    return new Promise(r => c.toBlob(r, 'image/webp', 0.9));
  }

  // Drag & drop pictures and sounds onto the dialog
  const isAudio = f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|wav|ogg|opus|flac|webm)$/i.test(f.name);
  const isImage = f => /^image\//.test(f.type);
  ['dragenter', 'dragover'].forEach(e => dlg.addEventListener(e, ev => {
    ev.preventDefault(); dlg.classList.add('drag');
  }));
  ['dragleave', 'drop'].forEach(e => dlg.addEventListener(e, ev => {
    if (e === 'dragleave' && dlg.contains(ev.relatedTarget)) return;
    dlg.classList.remove('drag');
  }));
  dlg.addEventListener('drop', ev => {
    ev.preventDefault();
    if (busy) return;
    for (const f of ev.dataTransfer.files) {
      if (isImage(f)) takeImage(f);
      else if (isAudio(f)) takeSound(f);
    }
  });
  // Dropping files anywhere on the page opens the "new button" dialog
  document.addEventListener('dragover', ev => { if (!dlg.open && !volDlg.open) ev.preventDefault(); });
  document.addEventListener('drop', ev => {
    if (dlg.open || volDlg.open) return;
    ev.preventDefault();
    const files = [...ev.dataTransfer.files];
    if (!files.length) return;
    openEditor(null);
    files.forEach(f => { if (isImage(f)) takeImage(f); else if (isAudio(f)) takeSound(f); });
  });

  previewBtn.addEventListener('click', () => {
    const src = pending.sound ? tempUrl(pending.sound) : (current && current.sound);
    if (!src) return;
    playUrl(src, current ? vol(current) : 1, '__preview', currentTrim());
  });

  $('cancelBtn').addEventListener('click', closeEditor);

  saveBtn.addEventListener('click', async () => {
    if (rec) { toast('Stop the recording first'); return; }
    if (!pending.sound && !(current && current.sound)) { toast('Choose or record a sound first'); return; }
    const label = labelInput.value.trim();
    const hasOwnPicture = pending.image || (current && current.image && !current.autoImage);
    const labelChanged = current && label !== (current.label || '');
    let autoImage = false;
    if (!hasOwnPicture) {
      if (!label) { toast('Add a picture or a label'); return; }
      autoImage = true;
      if (!current || !current.image || labelChanged) {
        pending.image = await initialsImage(label);
        pending.imageName = 'initials.webp';
      }
    }
    setBusy(true, 'Uploading…');
    try {
      const [image, sound] = await Promise.all([
        pending.image ? uploadFile(pending.image, pending.imageName || 'picture') : current.image,
        pending.sound ? uploadFile(pending.sound, pending.soundName) : current.sound,
      ]);
      setBusy(true, 'Saving…');
      const item = {
        id: current ? current.id : newId(),
        order: current ? current.order : (items.length ? Math.max(...items.map(i => i.order)) + 1 : 0),
        image, sound,
        soundName: pending.soundName || (current && current.soundName) || '',
        volume: current ? vol(current) : 1,
        autoImage,
        ...currentTrim(),
        label: labelInput.value.trim(),
      };
      await saveItems(item);
      if (current) Object.assign(current, item); else items.push(item);
      setBusy(false);
      closeEditor();
      render();
      toast('Saved');
      refresh(true);
    } catch (e) {
      setBusy(false);
      toast(e.message, 4000);
    }
  });

  async function move(dir) {
    const i = items.indexOf(current);
    const j = i + dir;
    if (!current || j < 0 || j >= items.length) return;
    const other = items[j];
    [current.order, other.order] = [other.order, current.order];
    setBusy(true);
    try {
      await saveItems(current, other);
    } catch (e) {
      [current.order, other.order] = [other.order, current.order];
      setBusy(false);
      toast(e.message, 4000);
      return;
    }
    setBusy(false);
    closeEditor();
    render();
    refresh(true);
  }
  $('moveLeft').addEventListener('click', () => move(-1));
  $('moveRight').addEventListener('click', () => move(1));

  $('deleteBtn').addEventListener('click', async () => {
    if (!current) return;
    if (!confirm('Delete this button for everyone?')) return;
    setBusy(true, 'Deleting…');
    try {
      await removeItem(current.id);
    } catch (e) {
      setBusy(false);
      toast(e.message, 4000);
      return;
    }
    items = items.filter(i => i !== current);
    setBusy(false);
    closeEditor();
    render();
    toast('Deleted');
    refresh(true);
  });

  // ---------- Volume settings ----------
  const volDlg = $('volDlg'), volList = $('volList');
  let volDraft = new Map();
  function openVolume() {
    stop();
    if (!items.length) { toast('Add a button first'); return; }
    volDraft = new Map(items.map(i => [i.id, vol(i)]));
    volList.innerHTML = '';
    for (const item of items) {
      const row = document.createElement('div');
      row.className = 'vrow';
      const name = document.createElement('div');
      name.className = 'vname';
      name.textContent = item.label || item.soundName || 'Sound';
      const pct = document.createElement('div');
      pct.className = 'vpct';
      const ctl = document.createElement('div');
      ctl.className = 'vctl';
      const range = document.createElement('input');
      range.type = 'range'; range.min = 0; range.max = 400; range.step = 10;
      range.value = Math.round(vol(item) * 100);
      const show = () => { pct.textContent = range.value + '%'; };
      range.addEventListener('input', () => { volDraft.set(item.id, range.value / 100); show(); });
      const test = document.createElement('button');
      test.type = 'button'; test.className = 'btn'; test.textContent = '▶';
      test.addEventListener('click', () => playUrl(item.sound, volDraft.get(item.id), '__vol', item));
      show();
      ctl.append(range, test);
      row.append(name, pct, ctl);
      volList.append(row);
    }
    volDlg.showModal();
  }
  function closeVolume() { stop(); volDlg.close(); }
  $('volCancel').addEventListener('click', closeVolume);
  $('volSave').addEventListener('click', async () => {
    const changed = items.filter(i => Math.abs(vol(i) - volDraft.get(i.id)) > 0.001)
      .map(i => ({ ...i, volume: volDraft.get(i.id) }));
    if (!changed.length) { closeVolume(); return; }
    const btn = $('volSave');
    btn.disabled = true; btn.textContent = 'Saving…'; busy = true;
    try {
      await saveItems(...changed);
      changed.forEach(c => Object.assign(items.find(i => i.id === c.id), { volume: c.volume }));
      closeVolume();
      toast('Volume saved');
    } catch (e) {
      toast(e.message, 4000);
    }
    btn.disabled = false; btn.textContent = 'Save'; busy = false;
    refresh(true);
  });

  // ---------- Tile size (saved on this device) ----------
  const sizeRange = $('sizeRange');
  let tile = 150;
  try { tile = +localStorage.getItem('tileSize') || 150; } catch {}
  const applySize = () => document.documentElement.style.setProperty('--tile', tile + 'px');
  sizeRange.value = tile; applySize();
  sizeRange.addEventListener('input', () => {
    tile = +sizeRange.value; applySize();
    try { localStorage.setItem('tileSize', tile); } catch {}
  });

  // ---------- Header ----------
  $('addBtn').addEventListener('click', () => openEditor(null));
  $('editBtn').addEventListener('click', () => { editing = !editing; stop(); render(); });
  $('stopFab').addEventListener('click', stop);
  $('volBtn').addEventListener('click', openVolume);
  // Warm up audio on the first touch so the first tap plays instantly
  document.addEventListener('pointerdown', () => { if (!ctx) { audioCtx(); preloadAll(); } }, { once: true });

  // ---------- Start + keep in sync ----------
  render();
  refresh(true);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  setInterval(() => { if (!document.hidden) refresh(); }, 20000);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
